[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-useronboard"
version = "0.1.0"
description = "Enterprise Linux User Onboarding MCP Agent & CLI (Target Group Assignment, Shell Preferences, GitHub Auth Handover)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "paramiko>=3.4.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pyyaml>=6.0"
]

[project.scripts]
mcp-useronboard = "mcp_useronboard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_useronboard"]
